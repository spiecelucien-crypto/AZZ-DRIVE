name: AZZ-DRIVE
options:
  bundleIdPrefix: com.azzdrive
  deploymentTarget:
    iOS: "17.0"
targets:
  AZZ-DRIVE:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azzdrive.app
        PRODUCT_NAME: AZZ DRIVE
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "AZZ DRIVE utilise votre position pour afficher votre emplacement sur la carte."
