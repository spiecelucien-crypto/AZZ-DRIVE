name: Base radars (OpenStreetMap)

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les radars
        run: python3 scripts/update_radars.py BE NL LU FR CH DE
      - name: Enregistrer si changement
        run: |
          if git diff --quiet -- windows/data/radars.json; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/data/radars.json
          git commit -m "Base radars : mise à jour hebdomadaire depuis OpenStreetMap"
          git push
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
