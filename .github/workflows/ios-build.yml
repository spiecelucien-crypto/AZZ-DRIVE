name: iOS build & tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Tests du moteur (Linux, rapide)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Tests du cœur de navigation
        run: swift test

  ios:
    name: Compilation iOS + tests simulateur
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulateur : $UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AZZ-DRIVE.xcodeproj \
            -scheme AZZ-DRIVE \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee build.log | grep -E "error:|warning: .*AZZ|Test Case|TEST SUCCEEDED|TEST FAILED|\*\*" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Captures d'écran (mode démo)
        if: success()
        timeout-minutes: 16
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/AZZ DRIVE.app"
          BID=com.azzdrive.app
          mkdir -p screenshots
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl privacy "$UDID" grant location "$BID" || true
          xcrun simctl location "$UDID" set 51.2172,4.4211 || true
          xcrun simctl install "$UDID" "$APP"
          shot() { xcrun simctl io "$UDID" screenshot "screenshots/$1.png"; }

          xcrun simctl launch "$UDID" "$BID"; sleep 12; shot 1-exploration
          xcrun simctl terminate "$UDID" "$BID"

          xcrun simctl launch "$UDID" "$BID" -AZZDemo -AZZDemoPreview; sleep 15; shot 2-apercu-itineraire
          xcrun simctl terminate "$UDID" "$BID"

          xcrun simctl launch "$UDID" "$BID" -AZZDemo; sleep 16; shot 3-navigation
          sleep 8; shot 4-navigation-virage
          xcrun simctl terminate "$UDID" "$BID"

          xcrun simctl launch "$UDID" "$BID" -AZZDemo -AZZDemoHUD -AZZVehicle suv; sleep 18; shot 5-navigation-suv
          xcrun simctl terminate "$UDID" "$BID"

          # Interface complète en paysage (comme un écran de voiture).
          xcrun simctl launch "$UDID" "$BID" -AZZDemo -AZZDemoHUD -AZZLandscape; sleep 20; shot 7-paysage-nuit
          sleep 6; shot 8-paysage-virage
          xcrun simctl terminate "$UDID" "$BID"
          xcrun simctl launch "$UDID" "$BID" -AZZDemo -AZZDemoHUD -AZZLandscape -AZZMapStyle satellite3D; sleep 22; shot 9-paysage-satellite
          xcrun simctl terminate "$UDID" "$BID"
          # Remet les captures paysage à l'endroit si le simulateur les enregistre en portrait.
          for f in screenshots/7-*.png screenshots/8-*.png screenshots/9-*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            if [ "$H" -gt "$W" ]; then sips -r 270 "$f" >/dev/null; fi
          done
          xcrun simctl launch "$UDID" "$BID" -AZZSettings -AZZVehicle sportive; sleep 10; shot 6-reglages-vehicule
          xcrun simctl terminate "$UDID" "$BID"
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
